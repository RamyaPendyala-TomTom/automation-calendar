<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#automation-pathfinders Leave Calendar</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel CDNs to run JSX in browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        #root:empty::before {
            content: 'Loading Calendar Assets... If this persists, please check your internet connection or SharePoint permissions.';
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const TEAM_MEMBERS = [
            { id: '1', name: 'Selcuk', color: 'bg-blue-500', border: 'border-blue-200' },
            { id: '2', name: 'Bruno', color: 'bg-green-500', border: 'border-green-200' },
            { id: '3', name: 'Lazar', color: 'bg-purple-500', border: 'border-purple-200' },
            { id: '4', name: 'Dusan', color: 'bg-orange-500', border: 'border-orange-200' },
            { id: '5', name: 'Ramya', color: 'bg-indigo-500', border: 'border-indigo-200' },
        ];

        const INITIAL_LEAVES = [
            { id: 1, userId: '1', start: '2026-02-10', end: '2026-02-12', type: 'Holiday' },
            { id: 2, userId: '2', start: '2026-02-15', end: '2026-02-20', type: 'Holiday' },
            { id: 3, userId: '3', start: '2026-02-02', end: '2026-02-04', type: 'Sick Leave' },
            { id: 4, userId: '5', start: '2026-02-23', end: '2026-02-24', type: 'Personal' },
        ];

        function App() {
            const [currentDate, setCurrentDate] = useState(new Date(2026, 1, 1));
            const [leaves, setLeaves] = useState(INITIAL_LEAVES);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [newLeave, setNewLeave] = useState({ userId: '1', start: '', end: '', type: 'Holiday' });

            const daysInMonth = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const days = new Date(year, month + 1, 0).getDate();
                const calendarDays = [];
                const padding = firstDay === 0 ? 6 : firstDay - 1;
                for (let i = 0; i < padding; i++) calendarDays.push(null);
                for (let i = 1; i <= days; i++) calendarDays.push(new Date(year, month, i));
                return calendarDays;
            }, [currentDate]);

            const monthName = currentDate.toLocaleString('default', { month: 'long' });
            const year = currentDate.getFullYear();

            const handlePrevMonth = () => setCurrentDate(new Date(year, currentDate.getMonth() - 1, 1));
            const handleNextMonth = () => setCurrentDate(new Date(year, currentDate.getMonth() + 1, 1));

            const getLeavesForDate = (date) => {
                if (!date) return [];
                const dateStr = date.toISOString().split('T')[0];
                return leaves.filter(l => dateStr >= l.start && dateStr <= l.end);
            };

            const handleAddLeave = (e) => {
                e.preventDefault();
                if (!newLeave.start || !newLeave.end) return;
                setLeaves([...leaves, { ...newLeave, id: Date.now() }]);
                setIsModalOpen(false);
            };

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-900">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                            <div>
                                <h1 className="text-2xl font-bold flex items-center gap-2">
                                    <span className="text-2xl">🌴</span>
                                    #automation-pathfinders Leave Calendar
                                </h1>
                                <p className="text-slate-500 text-sm mt-1">Track availability for the Amsterdam & Belgrade squads.</p>
                            </div>
                            <button
                                onClick={() => setIsModalOpen(true)}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl flex items-center gap-2 transition-all shadow-md active:scale-95 font-semibold"
                            >
                                <span className="text-xl">+</span> Register My Leave
                            </button>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
                            <div className="lg:col-span-1 space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                        <span>👥</span> Team Roster
                                    </h2>
                                    <div className="space-y-3">
                                        {TEAM_MEMBERS.map(member => (
                                            <div key={member.id} className="flex items-center gap-3">
                                                <div className={`w-3 h-3 rounded-full ${member.color}`} />
                                                <span className="text-sm text-slate-600 font-medium">{member.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
                                    <h2 className="font-bold text-indigo-900 mb-2 flex items-center gap-2">
                                        <span>ℹ️</span> RC Cycle Reminder
                                    </h2>
                                    <p className="text-xs text-indigo-700 leading-relaxed">
                                        Ensure leaves are logged 1 week in advance to coordinate automated regression triggers.
                                    </p>
                                </div>
                            </div>

                            <div className="lg:col-span-3 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                                <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-white">
                                    <h3 className="font-bold text-xl text-slate-900">{monthName} {year}</h3>
                                    <div className="flex gap-2">
                                        <button onClick={handlePrevMonth} className="w-10 h-10 flex items-center justify-center hover:bg-slate-100 rounded-lg border border-slate-200 font-bold text-slate-600 transition-colors">←</button>
                                        <button onClick={handleNextMonth} className="w-10 h-10 flex items-center justify-center hover:bg-slate-100 rounded-lg border border-slate-200 font-bold text-slate-600 transition-colors">→</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-7 border-b border-slate-100 bg-slate-50/50">
                                    {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => (
                                        <div key={day} className="py-3 text-center text-[11px] font-black text-slate-400 uppercase tracking-widest">{day}</div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-7 auto-rows-[120px]">
                                    {daysInMonth.map((date, idx) => {
                                        const dayLeaves = getLeavesForDate(date);
                                        const isToday = date && date.toDateString() === new Date().toDateString();
                                        return (
                                            <div key={idx} className={`border-r border-b border-slate-100 p-2 relative ${!date ? 'bg-slate-50/40' : 'hover:bg-slate-50/20'}`}>
                                                {date && (
                                                    <span className={`text-sm font-bold inline-flex items-center justify-center rounded-lg w-7 h-7 ${isToday ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>
                                                        {date.getDate()}
                                                    </span>
                                                )}
                                                <div className="mt-2 space-y-1">
                                                    {dayLeaves.map(leave => {
                                                        const member = TEAM_MEMBERS.find(m => m.id === leave.userId);
                                                        return (
                                                            <div key={leave.id} className={`text-[10px] px-2 py-1 rounded-md border shadow-sm truncate font-bold text-white ${member?.color}`}>
                                                                {member?.name}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden">
                                <div className="bg-indigo-600 p-8 text-white">
                                    <h2 className="text-2xl font-bold mb-1">Plan Your Leave</h2>
                                    <p className="text-indigo-100 text-sm">Synchronize your time off with the team.</p>
                                </div>
                                <form onSubmit={handleAddLeave} className="p-8 space-y-5">
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase mb-2">Team Member</label>
                                        <select
                                            className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-3 outline-none focus:border-indigo-500 font-semibold"
                                            onChange={e => setNewLeave({...newLeave, userId: e.target.value})}
                                            value={newLeave.userId}
                                        >
                                            {TEAM_MEMBERS.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-black text-slate-400 uppercase mb-2">Start</label>
                                            <input type="date" required className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-3 font-semibold" onChange={e => setNewLeave({...newLeave, start: e.target.value})}/>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-black text-slate-400 uppercase mb-2">End</label>
                                            <input type="date" required className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-3 font-semibold" onChange={e => setNewLeave({...newLeave, end: e.target.value})}/>
                                        </div>
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 font-bold text-slate-500 py-3.5">Cancel</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">Save & Post</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
