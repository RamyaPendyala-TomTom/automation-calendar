<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#automation-pathfinders Leave Calendar</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel CDNs to run JSX in browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        #root:empty::before {
            content: 'Loading Calendar Assets... If this persists, please ensure you are connected to the internet.';
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        
        const TEAM_MEMBERS = [
            { id: '1', name: 'Selcuk', color: 'bg-blue-600', border: 'border-blue-200' },
            { id: '2', name: 'Bruno', color: 'bg-emerald-600', border: 'border-emerald-200' },
            { id: '3', name: 'Lazar', color: 'bg-purple-600', border: 'border-purple-200' },
            { id: '4', name: 'Dusan', color: 'bg-orange-600', border: 'border-orange-200' },
            { id: '5', name: 'Ramya', color: 'bg-indigo-600', border: 'border-indigo-200' },
        ];

        // Categories: Bank Holiday, Vacation, Event, Travel
        const LEAVE_TYPES = ['Vacation', 'Bank Holiday', 'Event', 'Travel', 'Development Day'];

        // Cleared initial holidays
        const INITIAL_LEAVES = [];

        function App() {
            const [currentDate, setCurrentDate] = useState(new Date(2026, 1, 1)); // Start at Feb 2026
            const [leaves, setLeaves] = useState(INITIAL_LEAVES);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [newLeave, setNewLeave] = useState({ userId: '1', start: '', end: '', type: 'Vacation' });

            const daysInMonth = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const days = new Date(year, month + 1, 0).getDate();
                const calendarDays = [];
                const padding = firstDay === 0 ? 6 : firstDay - 1; // Align to Monday start
                for (let i = 0; i < padding; i++) calendarDays.push(null);
                for (let i = 1; i <= days; i++) calendarDays.push(new Date(year, month, i));
                return calendarDays;
            }, [currentDate]);

            const monthName = currentDate.toLocaleString('default', { month: 'long' });
            const year = currentDate.getFullYear();

            const handlePrevMonth = () => setCurrentDate(new Date(year, currentDate.getMonth() - 1, 1));
            const handleNextMonth = () => setCurrentDate(new Date(year, currentDate.getMonth() + 1, 1));

            const getLeavesForDate = (date) => {
                if (!date) return [];
                const dateStr = date.toISOString().split('T')[0];
                return leaves.filter(l => dateStr >= l.start && dateStr <= l.end);
            };

            const handleAddLeave = (e) => {
                e.preventDefault();
                if (!newLeave.start || !newLeave.end) return;
                setLeaves([...leaves, { ...newLeave, id: Date.now() }]);
                setIsModalOpen(false);
            };

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-900">
                    <div className="max-w-7xl mx-auto">
                        
                        {/* Header */}
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                            <div>
                                <h1 className="text-2xl font-bold flex items-center gap-2">
                                    <span className="text-3xl">🗓️</span>
                                    #automation-team Calendar
                                </h1>
                                <p className="text-slate-500 text-sm mt-1">Automation Team Availability</p>
                            </div>
                            <button 
                                onClick={() => setIsModalOpen(true)} 
                                className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2 transition-all shadow-lg active:scale-95 font-bold"
                            >
                                <span className="text-xl">+</span> Register Leave
                            </button>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-8">
                            
                            {/* Left Panel: Legend */}
                            <div className="lg:col-span-1 space-y-6">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold text-slate-800 mb-4 flex items-center gap-2 uppercase text-xs tracking-widest text-slate-400">
                                        <span>👥</span> Team
                                    </h2>
                                    <div className="space-y-3">
                                        {TEAM_MEMBERS.map(member => (
                                            <div key={member.id} className="flex items-center gap-3">
                                                <div className={`w-3 h-3 rounded-full ${member.color}`} />
                                                <span className="text-sm text-slate-600 font-semibold">{member.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold text-slate-800 mb-4 flex items-center gap-2 uppercase text-xs tracking-widest text-slate-400">
                                        <span>🏷️</span> Leave Types
                                    </h2>
                                    <div className="space-y-2">
                                        {LEAVE_TYPES.map(type => (
                                            <div key={type} className="text-[10px] font-black text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg uppercase tracking-tight">
                                                {type}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Main Calendar Grid */}
                            <div className="lg:col-span-4 bg-white rounded-[2.5rem] shadow-xl border border-slate-200 overflow-hidden">
                                <div className="p-6 border-b border-slate-100 flex items-center justify-between bg-white">
                                    <h3 className="font-black text-2xl text-slate-900">{monthName} {year}</h3>
                                    <div className="flex gap-3">
                                        <button onClick={handlePrevMonth} className="w-12 h-12 flex items-center justify-center hover:bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold text-slate-600 transition-all shadow-sm">←</button>
                                        <button onClick={handleNextMonth} className="w-12 h-12 flex items-center justify-center hover:bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold text-slate-600 transition-all shadow-sm">→</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-7 border-b border-slate-100 bg-slate-50/50">
                                    {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => (
                                        <div key={day} className="py-4 text-center text-[11px] font-black text-slate-400 uppercase tracking-widest">{day}</div>
                                    ))}
                                </div>

                                <div className="grid grid-cols-7 auto-rows-[130px]">
                                    {daysInMonth.map((date, idx) => {
                                        const dayLeaves = getLeavesForDate(date);
                                        const isToday = date && date.toDateString() === new Date().toDateString();
                                        return (
                                            <div key={idx} className={`border-r border-b border-slate-100 p-2 relative ${!date ? 'bg-slate-50/40' : 'hover:bg-slate-50/20'}`}>
                                                {date && (
                                                    <span className={`text-xs font-black inline-flex items-center justify-center rounded-xl w-8 h-8 ${isToday ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-400'}`}>
                                                        {date.getDate()}
                                                    </span>
                                                )}
                                                <div className="mt-2 space-y-1.5 overflow-y-auto max-h-[85px] scrollbar-hide">
                                                    {dayLeaves.map(leave => {
                                                        const member = TEAM_MEMBERS.find(m => m.id === leave.userId);
                                                        return (
                                                            <div 
                                                                key={leave.id} 
                                                                className={`text-[9px] px-2 py-1.5 rounded-lg border shadow-sm truncate font-black text-white leading-none ${member?.color} ${member?.border}`}
                                                                title={`${member?.name}: ${leave.type}`}
                                                            >
                                                                {member?.name} <span className="opacity-70 font-medium">({leave.type})</span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Registration Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-300">
                                <div className="bg-indigo-600 p-10 text-white">
                                    <h2 className="text-3xl font-black mb-2">Register Leave</h2>
                                    <p className="text-indigo-100/80 font-medium">Coordinate your time off with the squad.</p>
                                </div>
                                <form onSubmit={handleAddLeave} className="p-10 space-y-6">
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Team Member</label>
                                        <select 
                                            className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-5 py-4 outline-none focus:border-indigo-500 font-bold text-slate-700 appearance-none shadow-sm" 
                                            onChange={e => setNewLeave({...newLeave, userId: e.target.value})}
                                            value={newLeave.userId}
                                        >
                                            {TEAM_MEMBERS.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Start Date</label>
                                            <input type="date" required className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-5 py-4 font-bold shadow-sm" onChange={e => setNewLeave({...newLeave, start: e.target.value})}/>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">End Date</label>
                                            <input type="date" required className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-5 py-4 font-bold shadow-sm" onChange={e => setNewLeave({...newLeave, end: e.target.value})}/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Leave Category</label>
                                        <select 
                                            className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-5 py-4 outline-none focus:border-indigo-500 font-bold text-slate-700 appearance-none shadow-sm" 
                                            value={newLeave.type}
                                            onChange={e => setNewLeave({...newLeave, type: e.target.value})}
                                        >
                                            {LEAVE_TYPES.map(type => <option key={type} value={type}>{type}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 font-black text-slate-400 py-4 uppercase tracking-widest text-xs">Cancel</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all uppercase tracking-widest text-xs">Confirm & Post</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
