<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Team Leave Calendar</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        window.FirebaseAPI = { 
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, 
            onAuthStateChanged, getFirestore, collection, doc, setDoc, 
            addDoc, deleteDoc, onSnapshot, query 
        };
    </script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        #root:empty::before {
            content: 'Initializing Automation Team Calendar...';
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: #64748b;
            font-weight: 600;
        }
        .leave-item { transition: all 0.2s ease; position: relative; min-height: 28px; }
        .leave-item:hover { filter: brightness(1.1); }
        .controls-wrapper {
            flex-shrink: 0;
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: auto;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // --- 1. TEAM CONFIGURATION ---
        const TEAM_MEMBERS = [
            { id: '1', name: 'Selcuk', color: 'bg-blue-600', border: 'border-blue-700' },
            { id: '2', name: 'Bruno', color: 'bg-teal-600', border: 'border-teal-700' },
            { id: '3', name: 'Lazar', color: 'bg-violet-600', border: 'border-violet-700' },
            { id: '4', name: 'Dusan', color: 'bg-rose-600', border: 'border-rose-700' },
            { id: '5', name: 'Ramya', color: 'bg-amber-600', border: 'border-amber-700' },
        ];

        const LOCATIONS = [
            { id: 'loc-nl', name: 'NL (Office)', color: 'bg-slate-500', border: 'border-slate-600' },
            { id: 'loc-bel', name: 'Belgrade (Office)', color: 'bg-slate-500', border: 'border-slate-600' }
        ];

        const LEAVE_TYPES = ['Vacation', 'Bank Holiday', 'Event', 'Travel', 'Development Day'];

        // --- 2. CLOUD CONFIGURATION (UPDATED WITH YOUR DETAILS) ---
        const MY_PRIVATE_CLOUD_CONFIG = {
            apiKey: "AIzaSyBOHaCBiyn04mePc3oULHsWs7Lrs9agaSE",
            authDomain: "automation-calendar-cea62.firebaseapp.com",
            projectId: "automation-calendar-cea62",
            storageBucket: "automation-calendar-cea62.firebasestorage.app",
            messagingSenderId: "1076970331923",
            appId: "1:1076970331923:web:902eef8a54db09487504e6"
        };

        function App() {
            const [user, setUser] = useState(null);
            const [db, setDb] = useState(null);
            const [isCloud, setIsCloud] = useState(false);
            const [leaves, setLeaves] = useState(() => {
                const saved = localStorage.getItem('automation_leaves_v5');
                return saved ? JSON.parse(saved) : [];
            });
            const [currentDate, setCurrentDate] = useState(new Date(2026, 1, 1));
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            const [editingId, setEditingId] = useState(null);
            const [formState, setFormState] = useState({ userId: '1', start: '', end: '', type: 'Vacation' });

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'automation-team-calendar';

            useEffect(() => {
                const initialize = async () => {
                    const { initializeApp, getAuth, getFirestore, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseAPI;
                    
                    const config = (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null) || MY_PRIVATE_CLOUD_CONFIG;

                    if (config) {
                        try {
                            const app = initializeApp(config);
                            const auth = getAuth(app);
                            const firestore = getFirestore(app);
                            setDb(firestore);

                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }

                            onAuthStateChanged(auth, (u) => {
                                if (u) { setUser(u); setIsCloud(true); }
                            });
                        } catch (e) {
                            console.error("Firebase init error:", e);
                            setUser({ uid: 'local-user' });
                        }
                    } else {
                        setUser({ uid: 'local-user' });
                    }
                };
                initialize();
            }, []);

            useEffect(() => {
                if (!isCloud || !user || !db) return;
                const { collection, onSnapshot } = window.FirebaseAPI;
                const leavesRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaves');
                const unsubscribe = onSnapshot(leavesRef, (snap) => {
                    const data = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                    setLeaves(data);
                    localStorage.setItem('automation_leaves_v5', JSON.stringify(data));
                }, (err) => console.error("Sync error:", err));
                return () => unsubscribe();
            }, [user, isCloud, db, appId]);

            const daysInMonth = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const days = new Date(year, month + 1, 0).getDate();
                const calendarDays = [];
                const padding = firstDay === 0 ? 6 : firstDay - 1; 
                for (let i = 0; i < padding; i++) calendarDays.push(null);
                for (let i = 1; i <= days; i++) calendarDays.push(new Date(year, month, i));
                return calendarDays;
            }, [currentDate]);

            const getLeavesForDate = (date) => {
                if (!date) return [];
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                const dateStr = `${y}-${m}-${d}`;
                return leaves.filter(l => dateStr >= l.start && dateStr <= l.end);
            };

            const handleSave = async (e) => {
                e.preventDefault();
                if (!formState.start || !formState.end) return;
                if (isCloud && db) {
                    try {
                        const { collection, doc, setDoc, addDoc } = window.FirebaseAPI;
                        const leavesRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaves');
                        if (editingId) {
                            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leaves', editingId), formState);
                        } else {
                            await addDoc(leavesRef, formState);
                        }
                    } catch (err) { console.error("Save error:", err); }
                } else {
                    const id = editingId || Date.now().toString();
                    const entry = { ...formState, id };
                    const updated = editingId ? leaves.map(l => l.id === editingId ? entry : l) : [...leaves, entry];
                    setLeaves(updated);
                    localStorage.setItem('automation_leaves_v5', JSON.stringify(updated));
                }
                setIsModalOpen(false);
                setEditingId(null);
            };

            const executeDelete = async () => {
                if (!deleteConfirmId) return;
                if (isCloud && db) {
                    try {
                        const { doc, deleteDoc } = window.FirebaseAPI;
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leaves', deleteConfirmId));
                    } catch (err) { console.error("Delete error:", err); }
                } else {
                    const updated = leaves.filter(l => l.id !== deleteConfirmId);
                    setLeaves(updated);
                    localStorage.setItem('automation_leaves_v5', JSON.stringify(updated));
                }
                setDeleteConfirmId(null);
            };

            if (!user) return null;

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-900">
                    <div className="max-w-7xl mx-auto">
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                            <div>
                                <h1 className="text-2xl font-bold flex items-center gap-2 tracking-tight">
                                    <span className="text-3xl">🗓️</span> Automation Team Calendar
                                </h1>
                                <p className="text-slate-500 text-sm mt-1 flex items-center gap-2 font-medium">
                                    Amsterdam & Belgrade Squad Status
                                    <span className={`px-2 py-0.5 rounded-full text-[9px] font-bold text-white uppercase ${isCloud ? 'bg-green-500 shadow-sm' : 'bg-amber-500 shadow-sm'}`}>
                                        {isCloud ? 'Synced Online' : 'Local Mode'}
                                    </span>
                                </p>
                            </div>
                            <button onClick={() => { setEditingId(null); setFormState({userId: '1', start: '', end: '', type: 'Vacation'}); setIsModalOpen(true); }} className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2 transition-all shadow-lg active:scale-95 font-bold">
                                <span>+</span> Register Leave
                            </button>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-8">
                            <div className="lg:col-span-1 space-y-4">
                                <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold text-slate-400 mb-4 uppercase text-[10px] tracking-widest">Squad Members</h2>
                                    <div className="space-y-3">
                                        {TEAM_MEMBERS.map(member => (
                                            <div key={member.id} className="flex items-center gap-3">
                                                <div className={`w-3 h-3 rounded-full ${member.color}`} />
                                                <span className="text-sm text-slate-700 font-bold">{member.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold text-slate-400 mb-4 uppercase text-[10px] tracking-widest">Legend</h2>
                                    <div className="flex flex-wrap gap-1.5">
                                        {LEAVE_TYPES.map(type => (
                                            <div key={type} className="text-[9px] font-black text-slate-500 bg-slate-100 px-2 py-1 rounded-md uppercase tracking-tight">{type}</div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-4 bg-white rounded-[2.5rem] shadow-xl border border-slate-200 overflow-hidden">
                                <div className="p-6 border-b border-slate-100 flex items-center justify-between bg-white">
                                    <h3 className="font-black text-2xl text-slate-900">{currentDate.toLocaleString('default', { month: 'long' })} {currentDate.getFullYear()}</h3>
                                    <div className="flex gap-2">
                                        <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} className="w-10 h-10 flex items-center justify-center hover:bg-slate-50 rounded-xl border border-slate-100 font-bold text-slate-600 transition-colors">←</button>
                                        <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} className="w-10 h-10 flex items-center justify-center hover:bg-slate-50 rounded-xl border border-slate-100 font-bold text-slate-600 transition-colors">→</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-7 border-b border-slate-100 bg-slate-50/50">
                                    {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => (
                                        <div key={day} className="py-3 text-center text-[10px] font-black text-slate-400 uppercase tracking-widest">{day}</div>
                                    ))}
                                </div>

                                <div className="grid grid-cols-7 auto-rows-[125px]">
                                    {daysInMonth.map((date, idx) => {
                                        const dayLeaves = getLeavesForDate(date);
                                        const isToday = date && date.toDateString() === new Date().toDateString();
                                        return (
                                            <div key={idx} className={`border-r border-b border-slate-100 p-1 relative ${!date ? 'bg-slate-50/40' : 'hover:bg-slate-50/10'}`}>
                                                {date && <span className={`text-[10px] font-black inline-flex items-center justify-center rounded-lg w-6 h-6 mb-1 ${isToday ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300'}`}>{date.getDate()}</span>}
                                                <div className="space-y-1 overflow-y-auto max-h-[90px] scrollbar-hide">
                                                    {dayLeaves.map(leave => {
                                                        const member = [...TEAM_MEMBERS, ...LOCATIONS].find(m => m.id === leave.userId);
                                                        return (
                                                            <div key={leave.id} className={`leave-item p-1.5 rounded-lg border shadow-sm text-white font-bold flex items-center gap-1 overflow-hidden ${member?.color || 'bg-slate-500'} ${member?.border || 'border-slate-600'}`}>
                                                                <span className="text-[9px] truncate flex-1 min-w-0">{member?.name} <span className="opacity-70 font-medium">({leave.type})</span></span>
                                                                <div className="shrink-0 flex gap-1 bg-black/20 rounded p-1">
                                                                    <button onClick={(e) => { e.stopPropagation(); setEditingId(leave.id); setFormState(leave); setIsModalOpen(true); }} className="hover:text-yellow-200 text-[12px] font-bold p-0.5">✎</button>
                                                                    <button onClick={(e) => { e.stopPropagation(); setDeleteConfirmId(leave.id); }} className="hover:text-red-200 text-[12px] font-bold">×</button>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
                                <div className="bg-indigo-600 p-8 text-white">
                                    <h2 className="text-2xl font-bold mb-1">{editingId ? 'Update Entry' : 'New Leave Entry'}</h2>
                                    <p className="text-indigo-100 text-xs font-medium uppercase tracking-wider tracking-tighter">Syncing with Automation Team</p>
                                </div>
                                <form onSubmit={handleSave} className="p-8 space-y-5">
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Team Member / Office</label>
                                        <select className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-3 outline-none focus:border-indigo-500 font-bold text-slate-700 appearance-none shadow-sm" onChange={e => setFormState({...formState, userId: e.target.value})} value={formState.userId}>
                                            <optgroup label="Individuals">{TEAM_MEMBERS.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</optgroup>
                                            <optgroup label="Office/Bank Holiday">{LOCATIONS.map(loc => <option key={loc.id} value={loc.id}>{loc.name}</option>)}</optgroup>
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 font-bold">Start</label>
                                            <input type="date" required value={formState.start} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-3 font-bold shadow-sm" onChange={e => setFormState({...formState, start: e.target.value})}/>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 font-bold">End</label>
                                            <input type="date" required value={formState.end} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-3 font-bold shadow-sm" onChange={e => setFormState({...formState, end: e.target.value})}/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Category</label>
                                        <select className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-3 outline-none focus:border-indigo-500 font-bold text-slate-700 shadow-sm" value={formState.type} onChange={e => setFormState({...formState, type: e.target.value})}>
                                            {LEAVE_TYPES.map(type => <option key={type} value={type}>{type}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 font-black text-slate-400 py-4 uppercase tracking-widest text-xs hover:text-slate-600 transition-colors">Cancel</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all uppercase tracking-widest text-xs">Confirm</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteConfirmId && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[60] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm p-8 text-center animate-in fade-in zoom-in duration-200">
                                <h3 className="text-xl font-bold text-slate-900 mb-2 font-black">Delete Entry?</h3>
                                <p className="text-slate-500 mb-8 text-sm leading-relaxed tracking-tight">Remove this from the team calendar? This cannot be undone.</p>
                                <div className="flex gap-4">
                                    <button onClick={() => setDeleteConfirmId(null)} className="flex-1 py-3 font-bold text-slate-400 hover:bg-slate-50 rounded-xl transition-colors">Cancel</button>
                                    <button onClick={executeDelete} className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold shadow-lg shadow-red-100 hover:bg-red-700 transition-all">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
